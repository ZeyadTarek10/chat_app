name: chat_app
description: "A new Flutter chat app."
version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'
dependencies:
  bloc: ^8.1.4
  cloud_firestore: ^6.3.0
  country_code_picker: ^3.4.1
  cupertino_icons: ^1.0.6
  dartz: ^0.10.1
  dio: ^5.4.3+1
  easy_localization: ^3.0.7
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.3.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  flutter_screenutil: ^5.9.1
  flutter_svg: ^2.0.10+1
  fluttertoast: ^8.2.12
  get_it: ^7.7.0
  go_router: ^14.0.0
  internet_connection_checker: ^1.0.0+1
  lottie: ^3.3.3
  modal_progress_hud_nsn: ^0.5.1
  permission_handler: ^11.3.1
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  sqflite: ^2.3.3+1
  url_launcher: ^6.3.0

dev_dependencies:
  build_runner: ^2.4.11
  flutter_gen_runner: null
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
dependency_overrides:
  win32: ^5.5.4

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  integrations:
    flutter_svg: true
    flare_flutter: true
    rive: true
    lottie: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # - assets/icons/
    - assets/languages/
    - assets/lottie/
    # - assets/fonts/
