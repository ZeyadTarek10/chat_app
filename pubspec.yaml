name: chat_app
description: "A new Flutter chat app."
version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3+1
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  shared_preferences: ^2.5.3
  internet_connection_checker: ^1.0.0+1
  get_it: ^7.7.0
  dartz: ^0.10.1
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.1
  sqflite: ^2.3.3+1
  easy_localization: ^3.0.7
  fluttertoast: ^8.2.12
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  pretty_dio_logger: ^1.4.0
  firebase_core: ^3.0.0
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  flutter_gen_runner:
dependency_overrides:
  win32: ^5.5.4


flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  integrations:
    flutter_svg: true
    flare_flutter: true
    rive: true
    lottie: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/languages/
    - assets/fonts/

