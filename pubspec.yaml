name: chat_app
description: "A new Flutter chat app."
version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'
dependencies:
  animate_do: ^4.2.0
  bloc: ^8.1.4
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.3.0
  country_code_picker: ^3.4.1
  cupertino_icons: ^1.0.6
  dartz: ^0.10.1
  dio: ^5.4.3+1
  easy_localization: ^3.0.7
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.3.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^8.1.5
  flutter_screenutil: ^5.9.1
  flutter_svg: ^2.0.10+1
  fluttertoast: ^8.2.12
  get_it: ^7.7.0
  go_router: ^14.0.0
  image_picker: ^1.2.2
  internet_connection_checker: ^1.0.0+1
  lottie: ^3.3.1
  modal_progress_hud_nsn: ^0.5.1
  permission_handler: ^12.0.1
  pretty_dio_logger: ^1.4.0
  share_plus: ^13.1.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  sqflite: ^2.3.3+1
  swipe_to: ^1.0.6
  url_launcher: ^6.3.0

dev_dependencies:
  build_runner: ^2.4.11
  flutter_gen_runner: null
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
dependency_overrides:
  win32: ^5.5.4

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  integrations:
    flutter_svg: true
    flare_flutter: true
    rive: true
    lottie: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/native_splash_icon_light.png"
  color_dark: "#212121"
  image_dark: "assets/images/native_splash_icon_dark.png"
  android_12:
    image: "assets/images/native_splash_icon_light.png"
    color: "#FFFFFF"
    image_dark: "assets/images/native_splash_icon_dark.png"
    color_dark: "#212121"
  android: true
  ios: true
  web: false
  fullscreen: false
  android_gravity: center
  ios_content_mode: center

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # - assets/icons/
    - assets/languages/
    - assets/lottie/
    - assets/fonts/

  fonts:
    # Arabic Font
    - family: Cairo
      fonts:
        - asset: assets/fonts/arabic/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/arabic/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/cairo/Cairo-Regular.ttf
          weight: 400
    # English Font
    - family: Roboto
      fonts:
        - asset: assets/fonts/english/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/english/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/english/roboto/Roboto-Regular.ttf
          weight: 400
